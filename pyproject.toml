[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rvc-api"
version = "0.1.0"
description = "A FastAPI server for RVC voice conversion"
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "MIT" }
authors = [
    { name = "RVC API contributors" }
]

dependencies = [
    "fairseq>=0.12.2",
    "fastapi[standard]>=0.115.0",
    "mojo>=1.2.0",
    "pedalboard>=0.9.17",
    "python-dotenv>=1.2.4",
    "rvc-python>=0.1.5",
    "scipy>=1.12.0",
    "setuptools<81",
    "sounddevice>=0.5.6",
    "soundfile>=0.12.1",
]

[project.scripts]
rvc-api = "rvc_api.api:main"
rvc-server = "rvc_api.api:main"
rvc-live = "rvc_api.live:main"

[tool.hatch.build.targets.wheel]
packages = ["rvc_api"]

# uv tool install --force git+https://github.com/mathakim29/voice-changer --with git+https://github.com/liyaodev/fairseq.git