[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omupy"
version = "0.1.0"
description = "API interface for RVC voice conversion"
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "MIT" }
authors = [
    { name = "Luqman Al-Hakim" }
]

dependencies = [
    "fairseq>=0.12.2",
    "fastapi[standard]>=0.115.0",
    "pedalboard>=0.9.17",
    "python-dotenv>=1.2.4",
    "rvc-python>=0.1.5",
    "scipy>=1.12.0",
    "setuptools<81",
    "sounddevice>=0.5.6",
    "soundfile>=0.12.1",
]

[project.scripts]
omupy = "omupy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["omupy"]
